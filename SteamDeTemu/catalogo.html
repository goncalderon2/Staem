<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo | SteamdeTemu</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<!-- HEADER -->
<header class="header">

    <a href="index.html" class="logo">
        Steam<span>deTemu</span>
    </a>

    <nav class="navbar">

        <a href="index.html">Inicio</a>

        <a href="catalogo.html" class="activo">
            Catálogo
        </a>

        <a href="biblioteca.html">
            Mi Biblioteca
        </a>

        <a href="nosotros.html">
            Nosotros
        </a>

        <a href="contacto.html">
            Contacto
        </a>

        <a href="login.html" class="btn-login">
            Iniciar sesión
        </a>

    </nav>

</header>


<!-- CONTENIDO PRINCIPAL -->
<main>

    <section class="catalogo">

        <!-- TÍTULO -->
        <div class="catalogo-encabezado">

            <h1>Catálogo de Videojuegos</h1>

            <p>
                Explora nuestra colección y encuentra tu próximo videojuego favorito.
            </p>

        </div>


        <!-- FILTROS -->
        <section class="filtros">

            <!-- BUSCADOR -->
            <div class="filtro-grupo">

                <label for="buscador">
                    Buscar videojuego
                </label>

                <input
                        type="text"
                        id="buscador"
                        placeholder="Escribe el nombre de un juego..."
                >

            </div>


            <!-- FILTRO GÉNERO -->
            <div class="filtro-grupo">

                <label for="filtro-genero">
                    Género
                </label>

                <select id="filtro-genero">

                    <option value="todos">
                        Todos los géneros
                    </option>

                </select>

            </div>


            <!-- FILTRO PLATAFORMA -->
            <div class="filtro-grupo">

                <label for="filtro-plataforma">
                    Plataforma
                </label>

                <select id="filtro-plataforma">

                    <option value="todos">
                        Todas las plataformas
                    </option>

                </select>

            </div>


            <!-- ORDENAMIENTO -->
            <div class="filtro-grupo">

                <label for="ordenar">
                    Ordenar por
                </label>

                <select id="ordenar">

                    <option value="nombre">
                        Nombre
                    </option>

                    <option value="anio">
                        Año de lanzamiento
                    </option>

                    <option value="valoracion">
                        Valoración
                    </option>

                </select>

            </div>

        </section>


        <!-- CONTADOR -->
        <p id="contador-juegos" class="contador-juegos">
            0 videojuegos encontrados
        </p>


        <!-- MENSAJE SIN RESULTADOS -->
        <p id="mensaje-vacio" class="mensaje-vacio">
            No se encontraron videojuegos.
        </p>


        <!-- CONTENEDOR DE VIDEOJUEGOS -->
        <div
                id="contenedor-videojuegos"
                class="contenedor-videojuegos"
        >

            <!-- JavaScript agregará las tarjetas aquí -->

        </div>

    </section>

</main>


<!-- FOOTER -->
<footer class="footer">

    <p>
        © 2026 SteamdeTemu - Biblioteca de Videojuegos
    </p>

    <p>
        Proyecto académico.
    </p>

</footer>


<!-- JAVASCRIPT -->
<script src="js/videojuegos.js"></script>

</body>

</html>
